name: CI

# Runs the JVM unit tests and Android lint on every pull request and on every push to main
# (requirements NFR-06, NFR-07, NFR-10).
# No secrets: the build has no local.properties here, so it uses the defaults of app/build.gradle.kts
# (fake data, empty CG_API_KEY). CI never calls the real API and never runs instrumented tests.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (caches the Gradle files)
        uses: gradle/actions/setup-gradle@v6

      # gradlew is stored without the execute bit (it was committed from Windows).
      - name: Make gradlew executable
        run: chmod +x gradlew

      # --continue: if the tests fail, lint still runs, so one run shows both results.
      - name: Unit tests and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --continue --stacktrace

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/lint-results-debug.*
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
